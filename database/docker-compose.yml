services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-superoffer}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in Dokploy}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-superoffer}
    volumes:
      - superoffer-mongodb-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/01-init-mongo.js:ro
    ports:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "--username", "${MONGO_INITDB_ROOT_USERNAME:-superoffer}", "--password", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  superoffer-mongodb-data:
